# --- Access ---------------------------------------------------------------
- name: Passwordless sudo for the Ansible user (kept managed)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-pi-cluster-ansible
    content: "{{ base_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# --- Identity -------------------------------------------------------------
# cloud-init caches the image's original hostname and resets it every boot.
- name: Disable cloud-init (first-boot provisioning is done)
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"

- name: Set hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: /etc/hosts entry for this host
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# --- Packages -------------------------------------------------------------
# Repairs a dpkg run that was interrupted (power loss mid-upgrade).
- name: Check for interrupted dpkg runs
  ansible.builtin.command: dpkg --audit
  register: base_dpkg_audit
  changed_when: false
  check_mode: false   # read-only, safe to run in --check

- name: Finish interrupted dpkg runs
  ansible.builtin.command: dpkg --configure -a
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: base_dpkg_audit.stdout | length > 0

- name: Full upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
    autoremove: true
    lock_timeout: 600   # wait for unattended-upgrades if it is mid-run
  register: base_upgrade

- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# --- Time sync ------------------------------------------------------------
- name: chrony running (replaces systemd-timesyncd)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"   # not installed yet during --check

# --- Wi-Fi power saving off (causes latency spikes that upset etcd) --------
- name: Wi-Fi power-save off service
  ansible.builtin.copy:
    dest: /etc/systemd/system/wifi-powersave-off.service
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Wi-Fi power saving on wlan0
      After=sys-subsystem-net-devices-wlan0.device
      BindsTo=sys-subsystem-net-devices-wlan0.device

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/iw dev wlan0 set power_save off
      RemainAfterExit=yes

      [Install]
      WantedBy=sys-subsystem-net-devices-wlan0.device
  register: base_wifi_unit

- name: Enable and start Wi-Fi power-save off
  ansible.builtin.systemd:
    name: wifi-powersave-off.service
    enabled: true
    state: "{{ 'restarted' if base_wifi_unit.changed else 'started' }}"
    daemon_reload: "{{ base_wifi_unit.changed }}"
  ignore_errors: "{{ ansible_check_mode }}"   # unit/iw not present yet during --check

# --- Unattended upgrades (security, non-kernel, no auto reboot) ------------
- name: Unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52pi-cluster-unattended
    mode: "0644"
    content: |
      // Managed by Ansible (pi-cluster base role)
      Unattended-Upgrade::Package-Blacklist {
      {% for p in base_unattended_blacklist %}
          "{{ p }}";
      {% endfor %}
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# --- SSH: key-only --------------------------------------------------------
- name: Verify key-based SSH works from the controller before disabling passwords
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=5
    {{ base_admin_user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false   # read-only

- name: Key-only SSH (01- sorts before cloud-init's 50- file, first value wins)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-pi-cluster.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pi-cluster base role)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f /etc/ssh/sshd_config
  notify: Reload ssh

# --- Firewall (only if ufw is already active) ------------------------------
- name: Check ufw status
  ansible.builtin.command: ufw status
  register: base_ufw_status
  changed_when: false
  check_mode: false   # read-only

- name: Firewall rules
  when: "'Status: active' in base_ufw_status.stdout"
  block:
    - name: SSH from LAN
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ lan_cidr }}"

    - name: k3s ports between nodes
      community.general.ufw:
        rule: allow
        port: "{{ item.1.port }}"
        proto: "{{ item.1.proto }}"
        from_ip: "{{ hostvars[item.0].ansible_host }}"
      loop: "{{ groups['k3s_servers'] | product(base_ufw_node_ports) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.port }}/{{ item.1.proto }}"

    - name: Kubernetes API from LAN (kubectl from the workstation)
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        from_ip: "{{ lan_cidr }}"

    - name: k3s pod and service networks
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
      loop: "{{ base_ufw_k3s_cidrs }}"

# --- Reboot if needed (one node at a time; playbook uses serial: 1) --------
- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: base_reboot_required.stat.exists and base_allow_reboot | default(false) | bool

- name: Warn about pending reboot
  ansible.builtin.debug:
    msg: "REBOOT REQUIRED but not allowed. Rerun with -e base_allow_reboot=true"
  when: base_reboot_required.stat.exists and not (base_allow_reboot | default(false) | bool)
