# Local, never-committed secrets directory on the workstation.
k3s_secrets_dir: "{{ lookup('env', 'HOME') }}/.config/pi-cluster"
k3s_token_file: "{{ k3s_secrets_dir }}/k3s-token"

# Install script pinned to the same tag as the binary (reproducible rebuilds).
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"

k3s_api_endpoint: "https://{{ hostvars[k3s_bootstrap_host].ansible_host }}:6443"

# Certificate names: every node IP.
k3s_tls_san: "{{ groups['k3s_servers'] | map('extract', hostvars, 'ansible_host') | list }}"

# etcd tuned for Wi-Fi + SD cards (defaults: 100ms / 1000ms).
k3s_etcd_heartbeat_ms: 500
k3s_etcd_election_ms: 5000
