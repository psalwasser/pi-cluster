# Node inventory. IPs are fixed by DHCP reservations on the router.
# To move to Ethernet: in the router, move each reservation from wlan_mac
# to eth_mac (same IP), set k3s_iface: eth0 in group_vars/all.yml, rerun.
all:
  children:
    k3s_servers:
      hosts:
        pi1:
          ansible_host: 10.0.0.104
          wlan_mac: "88:a2:9e:79:3e:6c"
          eth_mac: "88:a2:9e:79:3e:6b"
          k3s_bootstrap: true   # first server, runs --cluster-init
        pi2:
          ansible_host: 10.0.0.105
          wlan_mac: "88:a2:9e:7a:12:3b"
          eth_mac: "88:a2:9e:7a:12:3a"
        pi3:
          ansible_host: 10.0.0.239
          wlan_mac: "88:a2:9e:7a:23:06"
          eth_mac: "88:a2:9e:7a:23:05"
