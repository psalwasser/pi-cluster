# Cluster-wide add-ons (ingress, storage, certs, ...) live in manifests/infrastructure.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./manifests/infrastructure
  prune: true
  wait: true
